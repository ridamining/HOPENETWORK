<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HOPE NETWORK - API Test</title>
    <style>
        body { font-family: monospace; background: #0a0c10; color: #fff; padding: 20px; max-width: 500px; margin: auto; }
        button { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 16px; margin: 10px 0; }
        .debug { background: #1e1e2e; padding: 12px; border-radius: 12px; font-size: 12px; white-space: pre-wrap; overflow-x: auto; margin-top: 20px; }
        input { background: #1e1e2e; border: 1px solid #4f46e5; padding: 10px; border-radius: 8px; color: white; width: 100%; margin: 8px 0; }
    </style>
</head>
<body>
    <h1>HOPE NETWORK - API Test</h1>
    <p>Your API URL: <code id="apiUrlDisplay"></code></p>
    <button id="testBtn">🔌 Test API Connection</button>
    <div id="debug" class="debug">Waiting for test...</div>

    <hr>
    <h3>Quick Registration Test</h3>
    <input type="text" id="email" placeholder="Email" value="test@example.com">
    <input type="text" id="pass" placeholder="Password" value="123456">
    <input type="text" id="name" placeholder="Full Name" value="Test User">
    <button id="registerBtn">Create Account</button>

    <script>
        // --- CONFIGURATION ---
        const API_URL = "https://script.google.com/macros/s/AKfycbxuHLqQPQfqWtDT4ZGCwE_w1YypVYIS7TiJZ8vjudnKMi6zPI0T_IFKYE351g7GzOYinA/exec";
        
        document.getElementById('apiUrlDisplay').innerText = API_URL;

        function callApi(action, payload, callback) {
            const callbackName = 'cb_' + Math.random().toString(36).substr(2);
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.body.removeChild(script);
                callback(data);
            };
            const script = document.createElement('script');
            script.onerror = function() {
                delete window[callbackName];
                document.body.removeChild(script);
                callback({ success: false, msg: "Script load error" });
            };
            script.src = `${API_URL}?callback=${callbackName}&action=${action}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
            document.body.appendChild(script);
        }

        function log(msg) {
            const div = document.getElementById('debug');
            div.innerHTML += `<div>> ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
            console.log(msg);
        }

        function testAPI() {
            log("Testing API connection...");
            callApi('getSettings', {}, (res) => {
                log("Response: " + JSON.stringify(res));
                if (res && res.success !== undefined) {
                    log("✅ API is reachable!");
                } else {
                    log("❌ API error or unreachable");
                }
            });
        }

        function testRegister() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const name = document.getElementById('name').value;
            if (!email || !pass || !name) {
                log("Please fill all fields");
                return;
            }
            log(`Registering ${email}...`);
            callApi('register', { email, pass, name, ref: "none" }, (res) => {
                log("Register response: " + JSON.stringify(res));
                if (res.success) {
                    log("✅ Registration successful! You can now login.");
                } else {
                    log("❌ Registration failed: " + res.msg);
                }
            });
        }

        document.getElementById('testBtn').onclick = testAPI;
        document.getElementById('registerBtn').onclick = testRegister;
    </script>
</body>
</html>
