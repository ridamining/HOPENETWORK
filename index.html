<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HOPE NETWORK - Beta</title>
    <style>
        body { font-family: monospace; background: #0a0c10; color: #fff; padding: 20px; max-width: 500px; margin: auto; }
        button, .btn { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 16px; margin: 10px 0; cursor: pointer; }
        .debug { background: #1e1e2e; padding: 12px; border-radius: 12px; font-size: 12px; white-space: pre-wrap; overflow-x: auto; margin-top: 20px; }
        input, textarea { background: #1e1e2e; border: 1px solid #4f46e5; padding: 10px; border-radius: 8px; color: white; width: 100%; margin: 8px 0; }
        .hidden { display: none; }
        .glass { background: rgba(18,25,45,0.6); border-radius: 1.5rem; padding: 1rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="authContainer">
        <h1>HOPE NETWORK</h1>
        <p>API URL: <code id="apiUrlDisplay"></code></p>
        <button id="testBtn">🔌 Test API Connection</button>
        <div id="debug" class="debug">Waiting for test...</div>

        <hr>
        <h3>Login / Register</h3>
        <input type="email" id="email" placeholder="Email" value="">
        <input type="password" id="pass" placeholder="Password" value="">
        <div id="regFields" class="hidden">
            <input type="text" id="name" placeholder="Full Name">
            <input type="text" id="ref" placeholder="Referral Code (optional)">
        </div>
        <button id="authBtn">Login</button>
        <p id="toggleAuth" style="cursor:pointer; text-align:center; font-size:12px; margin-top:8px;">Create new account →</p>
    </div>

    <div id="mainApp" class="hidden">
        <h2>Welcome, <span id="userName"></span></h2>
        <p>UID: <span id="userUid"></span></p>
        <p>Balance: <span id="userBalance">0.00</span> HOPE</p>
        <p>Verified: <span id="userVerified"></span></p>
        <button id="mineBtn" onclick="handleMining()">Mine</button>
        <div class="glass">
            <h3>Send HOPE</h3>
            <input type="text" id="targetUid" placeholder="Recipient UID">
            <input type="number" id="sendAmount" placeholder="Amount">
            <button onclick="sendP2P()">Send</button>
        </div>
        <div class="glass">
            <h3>Chat</h3>
            <div id="chatBox" style="height:150px; overflow-y:auto; background:#000; padding:8px; border-radius:12px;"></div>
            <input type="text" id="chatMsg" placeholder="Type message...">
            <button onclick="sendChat()">Send</button>
        </div>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        // ========== CONFIGURATION ==========
        const API_URL = "https://script.google.com/macros/s/AKfycbxuHLqQPQfqWtDT4ZGCwE_w1YypVYIS7TiJZ8vjudnKMi6zPI0T_IFKYE351g7GzOYinA/exec";
        
        document.getElementById('apiUrlDisplay').innerText = API_URL;
        let currentUser = null;
        let syncInterval = null;

        // JSONP call (identical to working test)
        function callApi(action, payload, callback) {
            const callbackName = 'cb_' + Math.random().toString(36).substr(2);
            window[callbackName] = function(data) {
                delete window[callbackName];
                if (document.body.contains(script)) document.body.removeChild(script);
                if (callback) callback(data);
            };
            const script = document.createElement('script');
            script.onerror = function() {
                delete window[callbackName];
                document.body.removeChild(script);
                if (callback) callback({ success: false, msg: "Script load error" });
            };
            script.src = `${API_URL}?callback=${callbackName}&action=${action}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
            document.body.appendChild(script);
        }

        function log(msg) {
            const div = document.getElementById('debug');
            div.innerHTML += `<div>> ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
            console.log(msg);
        }

        function testAPI() {
            log("Testing API connection...");
            callApi('getSettings', {}, (res) => {
                log("Response: " + JSON.stringify(res));
                if (res && res.success !== undefined) {
                    log("✅ API is reachable!");
                } else {
                    log("❌ API error or unreachable");
                }
            });
        }

        // Auth mode toggle
        let isRegisterMode = false;
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('regFields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('authBtn').innerText = isRegisterMode ? 'Register' : 'Login';
            document.getElementById('toggleAuth').innerText = isRegisterMode ? '← Back to login' : 'Create new account →';
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if (!email || !pass) return log("Email and password required");

            if (isRegisterMode) {
                const name = document.getElementById('name').value.trim();
                if (!name) return log("Full name required");
                const ref = document.getElementById('ref').value.trim();
                callApi('register', { email, pass, name, ref: ref || "none" }, (res) => {
                    log("Register response: " + JSON.stringify(res));
                    if (res.success) {
                        log("✅ Registration successful! Please login.");
                        toggleAuthMode(); // switch back to login
                        document.getElementById('email').value = email;
                        document.getElementById('pass').value = '';
                    } else {
                        log("❌ Registration failed: " + res.msg);
                    }
                });
            } else {
                callApi('login', { email, pass }, (res) => {
                    log("Login response: " + JSON.stringify(res));
                    if (res.success) {
                        currentUser = res.user;
                        localStorage.setItem('hopeUser', JSON.stringify(currentUser));
                        startApp();
                    } else {
                        log("❌ Login failed: " + res.msg);
                    }
                });
            }
        }

        function startApp() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            syncUserData();
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(syncUserData, 30000);
        }

        function syncUserData() {
            if (!currentUser) return;
            callApi('sync', { uid: currentUser.uid, email: currentUser.email }, (res) => {
                if (res.success) {
                    currentUser = res.user;
                    localStorage.setItem('hopeUser', JSON.stringify(currentUser));
                    updateUI();
                } else {
                    log("Session expired, logging out");
                    logout();
                }
            });
        }

        function updateUI() {
            document.getElementById('userName').innerText = currentUser.name;
            document.getElementById('userUid').innerText = currentUser.uid;
            document.getElementById('userBalance').innerText = parseFloat(currentUser.bal).toFixed(2);
            document.getElementById('userVerified').innerText = currentUser.verified === 'TRUE' ? 'Yes' : 'No';
        }

        function handleMining() {
            const now = Date.now();
            const lastMine = currentUser.lastMine || 0;
            const diff = now - lastMine;
            if (lastMine === 0) {
                callApi('startMining', { uid: currentUser.uid }, (res) => {
                    if (res.success) {
                        log("Mining started");
                        syncUserData();
                    } else log("Error: " + res.msg);
                });
            } else if (diff >= 86400000) {
                callApi('claimMining', { uid: currentUser.uid }, (res) => {
                    if (res.success) {
                        log(`Claimed ${res.reward} HOPE`);
                        syncUserData();
                    } else log("Error: " + res.msg);
                });
            } else {
                const remaining = 86400000 - diff;
                const hours = Math.floor(remaining / 3600000);
                const mins = Math.floor((remaining % 3600000) / 60000);
                log(`Mining not ready. Wait ${hours}h ${mins}m`);
            }
        }

        function sendP2P() {
            const target = document.getElementById('targetUid').value.trim();
            const amount = parseFloat(document.getElementById('sendAmount').value);
            if (!target || isNaN(amount) || amount <= 0) return log("Valid target and amount required");
            callApi('p2p', { senderUid: currentUser.uid, targetUid: target, amount }, (res) => {
                if (res.success) {
                    log("Transfer sent");
                    syncUserData();
                    document.getElementById('targetUid').value = '';
                    document.getElementById('sendAmount').value = '';
                } else log("Error: " + res.msg);
            });
        }

        function sendChat() {
            const msg = document.getElementById('chatMsg').value.trim();
            if (!msg) return;
            callApi('sendMessage', { uid: currentUser.uid, sender: currentUser.name, text: msg }, () => {
                document.getElementById('chatMsg').value = '';
                loadChat();
            });
        }

        function loadChat() {
            callApi('getMessages', { uid: currentUser.uid }, (res) => {
                if (!res.history) return;
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = res.history.map(m => `<div><b>${m.sender}:</b> ${m.text}</div>`).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function logout() {
            localStorage.removeItem('hopeUser');
            if (syncInterval) clearInterval(syncInterval);
            location.reload();
        }

        // Event listeners
        document.getElementById('testBtn').onclick = testAPI;
        document.getElementById('authBtn').onclick = handleAuth;
        document.getElementById('toggleAuth').onclick = toggleAuthMode;

        // Check for stored user
        window.onload = () => {
            const stored = localStorage.getItem('hopeUser');
            if (stored) {
                currentUser = JSON.parse(stored);
                startApp();
                loadChat();
            }
        };
    </script>
</body>
</html>
